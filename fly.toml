# fly.toml app configuration file generated for ritika-sharma12 on 2026-08-30T18:57:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ritika-sharma12'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  SERVER_PORT = '8181'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
