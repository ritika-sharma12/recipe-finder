# fly.toml app configuration file generated for recipe-finder-ritika on 2026-08-30T21:24:16+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'recipe-finder-ritika'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile.fly'

[env]
  HOST = '0.0.0.0'
  NUXT_RECIPE_API_BASE = 'http://127.0.0.1:8181/api'
  PORT = '3000'
  SERVER_PORT = '8181'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
